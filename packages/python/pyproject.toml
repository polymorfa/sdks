[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "polymorfa-sdk"
version = "0.1.0.dev0"
description = "Handwritten asynchronous Polymorfa server SDK"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "cryptography>=43", "typing-extensions>=4.12"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "websockets>=14,<16", "fastapi>=0.115", "Django>=4.2", "aiohttp>=3.9,<4"]
fastapi = ["fastapi>=0.115"]
django = ["Django>=4.2"]
calls = ["websockets>=14,<16"]

[tool.hatch.build.targets.wheel]
packages = ["src/polymorfa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/polymorfa"]
