[package]
name = "polymorfa-sdk"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.85"
description = "Handwritten server clients for the Polymorfa Messaging and Platform APIs"
license = "MIT"
repository = "https://github.com/polymorfa/sdks"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "tests/**", "fixtures/**", "coverage.json", "supplements.json", "protocol-notes.md", "release-contract.json", ".cargo/config.toml"]

[features]
default = []
storage-sql = ["dep:sqlx"]
storage-libsql = ["dep:libsql"]
storage-s3 = ["dep:aws-sdk-s3"]
storage-dynamodb = ["dep:aws-sdk-dynamodb"]
storage-mongodb = ["dep:mongodb"]
storage-firestore = ["dep:firestore", "dep:gcloud-sdk", "dep:jsonwebtoken", "dep:simple_asn1", "dep:time"]

[dependencies]
async-stream = "0.3"
aws-sdk-dynamodb = { version = "=1.82.0", optional = true, default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aws-sdk-s3 = { version = "=1.96.0", optional = true, default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
firestore = { version = "=0.50.0", optional = true, default-features = false, features = ["tls-webpki-roots"] }
gcloud-sdk = { version = "=0.30.2", optional = true, default-features = false, features = ["google-firestore-v1", "tls-webpki-roots"] }
# Firestore authentication compatibility pins apply to fresh MSRV 1.85 consumers too.
jsonwebtoken = { version = "=10.3.0", optional = true, default-features = false, features = ["rust_crypto"] }
simple_asn1 = { version = "=0.6.3", optional = true }
time = { version = "=0.3.44", optional = true, default-features = false }
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
httpdate = "1"
libsql = { version = "=0.9.30", optional = true, default-features = false, features = ["remote", "tls"] }
mongodb = { version = "=3.3.0", optional = true, default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", optional = true, default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "sqlite"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "net", "io-util", "fs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

