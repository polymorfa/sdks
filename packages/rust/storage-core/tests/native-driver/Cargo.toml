[package]
name = "polymorfa-storage-native-acceptance"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
[dependencies]
polymorfa-sdk = {path="../../..",features=["storage-sql"]}
polymorfa-storage-core = {path="../.."}
tokio = {version="1",features=["macros","rt-multi-thread"]}
serde_json = "1"
futures-util = "0.3"
uuid = {version="=1.26.1",features=["v4"]}
