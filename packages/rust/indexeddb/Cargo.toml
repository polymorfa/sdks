[package]
name = "polymorfa-storage-indexeddb"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.85"
description = "Browser IndexedDB adapter for Polymorfa customer-owned storage"
license = "MIT"
repository = "https://github.com/polymorfa/sdks"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**"]
[dependencies]
polymorfa-storage-core = { version = "=0.1.0-dev.0", path = "../storage-core" }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["AbortController", "AbortSignal"] }
serde = "1"
serde_json = "1"
