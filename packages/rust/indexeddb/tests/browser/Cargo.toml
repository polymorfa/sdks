[package]
name = "polymorfa-indexeddb-browser-acceptance"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
polymorfa-storage-indexeddb = { path = "../.." }
polymorfa-storage-core = { path = "../../../storage-core" }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
uuid = { version = "=1.26.1", features = ["v4", "js"] }
