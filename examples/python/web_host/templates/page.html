<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python Polymorfa workspace</title>
    <script src="/assets/htmx.js" defer></script>
    <script type="module" src="/assets/elements.js"></script>
    <style>
      body {
        font: 16px system-ui;
        margin: 0;
        background: #f6f7f9;
        color: #17212d;
      }
      main {
        max-width: 1100px;
        margin: 16px auto;
        padding: 16px;
      }
      h1 { font-size: 26px; margin: 0 0 12px; }
      p, form { margin: 10px 0; }
      button,
      input {
        font: inherit;
        padding: 12px;
        border: 1px solid #6e7e91;
        border-radius: 8px;
      }
      button {
        cursor: pointer;
        background: #184a80;
        color: white;
      }
      label {
        display: block;
        margin: 16px 0;
      }
      input {
        display: block;
        max-width: 100%;
        margin-top: 8px;
      }
      pmfa-inbox {
        height: calc(100dvh - 280px);
        min-height: 360px;
        display: block;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #48a5ed;
        outline-offset: 3px;
      }
      @media (max-width: 600px) {
        main {
          margin: 0;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    {% include "workspace.html" %}
  </body>
</html>
