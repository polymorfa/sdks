name: Publish accepted SDK packages

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Package release channel from main
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: Exact x.y.z for a stable release; leave empty for nightly
        type: string

permissions: {}
concurrency:
  group: sdk-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
      STABLE_VERSION: ${{ inputs.version }}
      RELEASE_OUTPUT: .release/packs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Read exact API acceptance authority
        id: acceptance-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.SDK_COVERAGE_CLIENT_ID }}
          private-key: ${{ secrets.SDK_COVERAGE_APP_PRIVATE_KEY }}
          owner: polymorfa
          repositories: polymorfa
          permission-contents: read
          permission-actions: read
      - name: Require matching deployed API and skip unchanged nightlies
        id: gate
        env:
          GH_TOKEN: ${{ steps.acceptance-token.outputs.token }}
        run: node scripts/release-gate.mjs
      - if: steps.gate.outputs.publish == 'true'
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build:workspaces
          npm test
          node --test scripts/release-gate.test.mjs scripts/sync-linear-coverage.test.mjs
          npm run check:coverage
          npm run check:functions
          npm run check:names
          npm audit --omit=dev
      - if: steps.gate.outputs.publish == 'true'
        name: Pack matching packages with contract provenance
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: node scripts/dev-release.mjs pack --version "$VERSION" --out "$RELEASE_OUTPUT" --provenance "$RELEASE_OUTPUT/release-contract.json"
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-sdk-packs
          include-hidden-files: true
          path: .release/packs
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'stable' && 'npm-stable' || 'npm-dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
      RELEASE_OUTPUT: .release/packs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-sdk-packs
          include-hidden-files: true
          path: .release/packs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - name: Publish in dependency order and verify registry integrity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-release.mjs
      - name: Save publication receipts for later Linear updates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-publication-receipts
          path: |
            .release/packs/release-contract.json
            .release/packs/stage-events.json
          if-no-files-found: error
          retention-days: 90
