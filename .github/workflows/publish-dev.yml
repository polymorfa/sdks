name: Publish dev prereleases

# Publishes the public workspace packages to npm under the `dev` dist-tag
# after every push to `dev`. `latest` is never touched. See docs/releasing.md.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  build:
    name: Verify and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:workspaces
      - run: npm test
      - run: npm run check:coverage
      - run: npm run check:names
      - run: npm audit --omit=dev
      - id: version
        run: echo "version=$(node scripts/dev-release.mjs version)" >> "$GITHUB_OUTPUT"
      - name: Pack and verify tarballs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/dev-release.mjs pack --version "$VERSION" --out "$RUNNER_TEMP/packs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dev-packs
          path: ${{ runner.temp }}/packs
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm (dev tag)
    needs: build
    runs-on: ubuntu-latest
    environment: npm-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dev-packs
          path: packs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm with trusted publishing support
        run: |
          npm install --global npm@11.6.2
          npm --version
      - name: Check npm publish authentication is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Using NPM_TOKEN fallback for authentication."
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "Using GitHub Actions OIDC token for trusted publishing."
          else
            {
              echo "::error::No npm publish credentials available."
              echo "Neither the NPM_TOKEN fallback secret nor OIDC (id-token: write) is configured."
              echo "Set up trusted publishing or the NPM_TOKEN secret on the npm-dev environment before retrying."
              echo "See docs/releasing.md, 'One-time operator setup'."
            } >&2
            exit 1
          fi
      - name: Publish in dependency order
        env:
          # Empty unless the NPM_TOKEN fallback is configured. When empty,
          # npm authenticates with the workflow's OIDC token (trusted publishing).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const m = require("./packs/manifest.json");
            for (const p of m) console.log(`${p.name} ${p.tarball}`);
          ' | while read -r name tarball; do
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} already published; skipping"
              continue
            fi
            npm publish "./packs/${tarball}" --tag dev --access public --provenance
          done
      - name: Summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### Published ${VERSION} with dist-tag \`dev\`"
            echo
            echo '```bash'
            echo "npm install @polymorfa/sdk@${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
