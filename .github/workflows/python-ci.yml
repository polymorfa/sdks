name: Python SDK foundation

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/python/**"
      - ".github/workflows/python-ci.yml"
      - "contracts/openapi.platform.json"
  push:
    branches: [dev, main]
    paths:
      - "packages/python/**"
      - ".github/workflows/python-ci.yml"
      - "contracts/openapi.platform.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./packages/python build ruff==0.16.9
      - run: ruff check packages/python/src packages/python/tests
      - run: ruff format --check packages/python/src packages/python/tests
      - run: python -m unittest discover -s packages/python/tests -v
      - run: python -m build packages/python
