name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:workspaces
      - run: npm test
      - run: node --test scripts/release-gate.test.mjs scripts/native-release.test.mjs scripts/native-publish.test.mjs scripts/sync-linear-coverage.test.mjs
      - run: node --test scripts/sdk-fixture-server.test.mjs scripts/multi-language-coverage.test.mjs examples/calls-example/server-credential.test.mjs
      - run: python3 scripts/inspect-native-artifacts.test.py
      - run: python3 scripts/prepare-php-mirror.test.py
      - run: npm run build
      - run: npm run check:doc-snippets
      - run: npm run test:doc-snippets
      - run: npm run verify:doc-snippets -- typescript --negative-test
      - run: npm run check:machine-credentials
      - run: npm run check:coverage
      - run: node scripts/check-native-coverage.mjs
      - run: npm run check:functions
      - run: npm run check:names
      - run: npm pack --dry-run --workspaces --ignore-scripts
      - run: npm audit --omit=dev
